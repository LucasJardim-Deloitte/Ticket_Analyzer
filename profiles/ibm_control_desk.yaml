      beneficiary: Ana Fisher
      request_date: '2024-01-30'
      approval_date: '2024-01-30'
      implementation_date: '2024-01-30'
      validation_date: '2024-01-30'
      justification: No seguimento da anomalia SR151252, que está a condicionar 
        o carregamento de um ficheiro necessário para IFRS17, solicitou-se 
        acesso de debug e ST22 para apurar a causa do erro. O mesmo ficheiro é 
