# =============================================================================
# Profile de origem: IBM Control Desk (também conhecido como IBM Maximo IT)
# -----------------------------------------------------------------------------
# Aliases baseados nos campos típicos do IBM Control Desk / Maximo ITSM.
# Validar e ajustar com tickets reais — seguir docs/adding-a-new-source.md.
# =============================================================================

source_id: ibm_control_desk
display_name: "IBM Control Desk"
version: 1

field_aliases:
  ticket_code: ["Ticket ID", "Record ID", "Service Request", "SR", "Incident", "INC",
    "Número do ticket", "ID do pedido"]
  ticket_type: ["Class", "Classification", "Type", "Classe", "Tipo", "Categoria"]
  system: ["CI Name", "Configuration Item", "Asset", "Affected CI", "Sistema", "Ativo",
    "Item de configuração"]
  environment: ["Environment", "Ambiente", "Location", "Site"]
  state: ["Status", "State", "Situation", "Estado", "Situação"]
  requester: ["Reported By", "Affected Person", "Requestor", "Caller", "Reportado
        por", "Solicitante", "Afetado"]
  implementer: ["Owner", "Assigned To", "Technician", "Resolved By", "Responsável",
    "Atribuído a", "Resolvido por"]
  approver: ["Approved By", "Change Approver", "Authorized By", "Aprovado por", "Autorizador"]
  beneficiary: ["Affected Person", "Requested for", "Beneficiário", "Para"]
  justification: ["Description", "Long Description", "Justification", "Business Reason",
    "Descrição", "Justificação", "Motivo"]

date_aliases:
  request_date: ["Report Date", "Open Date", "Created", "Data de abertura", "Data
        de criação"]
  approval_date: ["Approval Date", "Authorized Date", "Data de aprovação"]
  implementation_date: ["Actual End", "Resolved Date", "Closed Date", "Data de resolução",
    "Data de fecho"]
  validation_date: ["Verified Date", "Tested Date", "Data de verificação"]

date_formats:
  - "%d/%m/%Y %H:%M:%S"
  - "%d/%m/%Y %H:%M"
  - "%Y-%m-%d %H:%M:%S"
  - "%Y-%m-%dT%H:%M:%S"
  - "%d-%m-%Y"

expected_states:
  - "Closed"
  - "Resolved"
  - "Complete"
  - "Fechado"
  - "Resolvido"
  - "Concluído"

checks:
  confidence_threshold: 0.6
  sod:
    include_beneficiary: false
    allow_role_overlap: false
  validation:
    required: false
  timeliness:
    enabled: false
    sla_days:

extraction_notes: |
  - O IBM Control Desk usa "SR" para Service Request e "INC" para Incident —
    usar o número completo como ticket_code (ex: SR000123).
  - O campo "Reported By" é quem abriu o ticket (requester).
    "Affected Person" pode ser o utilizador que recebe o acesso — usar como
    contexto adicional mas não confundir com requester.
  - Aprovações podem aparecer numa secção "Workflow" ou "Approvals" com
    múltiplas entradas — extrair a aprovação final.
  - Datas podem aparecer no formato europeu (DD/MM/YYYY).

